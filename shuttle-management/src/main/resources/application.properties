spring.application.name=shuttle-management

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/shuttle_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL Script Initialization (set to 'never' since tables & data were created in MySQL Workbench)
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# SQL Logging for inspection
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
