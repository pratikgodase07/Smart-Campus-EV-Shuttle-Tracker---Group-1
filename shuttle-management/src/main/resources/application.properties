spring.application.name=shuttle-management

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/campus_shuttle_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL Script Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# SQL Logging for inspection
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
