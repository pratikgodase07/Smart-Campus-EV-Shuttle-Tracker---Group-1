spring.application.name=shuttle-management

# ─── MySQL DataSource ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/ev_shuttle_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── SQL Initialization ──────────────────────────────────────────────────────
# Runs schema.sql then data.sql on every startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ─── Logging ────────────────────────────────────────────────────────────────
spring.main.banner-mode=off
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.com.campus=INFO
