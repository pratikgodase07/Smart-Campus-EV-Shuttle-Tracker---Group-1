spring.application.name=smart-campus-ev-shuttle-tracker

# ===================================================
# MySQL Database Configuration
# ===================================================
spring.datasource.url=jdbc:mysql://localhost:3306/shuttle_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================
# SQL Script Initialization
# (Set to 'always' to auto-populate tables and seed data, or 'never' if already created via Workbench)
# ===================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ===================================================
# Logging Configuration
# ===================================================
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.com.campus.shuttle=INFO
